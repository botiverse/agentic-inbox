# Deploy agentic-inbox to Cloudflare Workers.
#
# WHY THIS EXISTS: deploys were manual `wrangler deploy` runs from a laptop, so
# the only available credential was a HUMAN's Cloudflare login. An agent asked to
# deploy then has to either refuse (writing to production infra with someone
# else's credential) or breach that line. CI removes the dilemma: the pipeline
# carries its OWN scoped credential, so "deploy" is an action anyone authorized
# can trigger without borrowing an identity.
#
# THE GATE IS WHO CAN DISPATCH. This workflow deliberately does not restrict which
# ref may be deployed (you must be able to ship a hotfix branch), so the only
# control is GitHub's "who may run this workflow" permission. Do not read the
# existence of CI as "CI constrains what reaches production" — it does not; the
# repo's actor permissions do. (raised by Gogo in review of PR #8)
#
# ONE-TIME HUMAN SETUP (cannot be done from here — needs Cloudflare access):
#   gh secret set CLOUDFLARE_API_TOKEN   # Workers Scripts:Edit on the botiverse account
#   gh secret set CLOUDFLARE_ACCOUNT_ID  # target account id
# Scope the token to Workers deploys only — it should not be able to touch DNS,
# Email Routing, or Access.
name: deploy

# MANUAL ONLY, by artin's call: a deploy is an explicit decision, not a
# side effect of pushing. `ref` lets you deploy any branch/tag/SHA, so work can
# continue on a feature branch while you choose exactly what goes to production.
#
# NOTE: GitHub only offers workflow_dispatch for workflows present on the DEFAULT
# branch, so this file has to reach `main` before the button exists — even though
# the ref you deploy can be any branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) to deploy"
        required: false
        default: ""

concurrency:
  # Never let two deploys race; a queued one supersedes, but the in-flight one is
  # allowed to finish so we never abandon a half-applied rollout.
  group: deploy-agentic-inbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate BEFORE deploying: a red typecheck or test never reaches production.
      # MUST be the repo's own script, not a bare `tsc -b`. The type definitions
      # for `Env` (worker-configuration.d.ts) and the react-router route types are
      # GENERATED and .gitignore'd, so a clean CI checkout does not have them —
      # bare `tsc -b` then fails with "Property 'BUCKET' does not exist on type
      # 'Env'". It passes on a dev machine only because the generated files are
      # already sitting there, which is exactly what makes a bare tsc non-hermetic.
      # `npm run typecheck` = cf-typegen && react-router typegen && tsc -b.
      # Verified credential-free: generation reads wrangler.jsonc locally and
      # succeeds while `wrangler whoami` reports unauthenticated, so this runs
      # before the credential gate without needing secrets.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build first, as its own step: `wrangler deploy` alone can ship a stale
      # build/ artifact, which once shipped old code under a new version id.
      - name: Build
        run: npm run build

      - name: Record expected SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Fail with an instruction rather than an opaque wrangler auth error the
      # first time this runs before the one-time secret setup.
      - name: Check deploy credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — one-time setup by someone with Cloudflare access: gh secret set CLOUDFLARE_API_TOKEN (Workers Scripts:Edit only) and gh secret set CLOUDFLARE_ACCOUNT_ID. Everything above this step (typecheck, tests, build) already passed."
            exit 1
          fi

      # `wrangler deploy` reads the wrangler config from the CHECKED-OUT ref, not
      # from the branch this workflow file lives on. A dispatch of some other ref
      # whose config carries a different `name` would deploy successfully — to a
      # DIFFERENT worker. Assert the target before writing anything. (Gogo has
      # paid for this exact shape: a trigger deploys the script it is bound to,
      # not the config you were looking at.)
      - name: Assert deploy target
        run: |
          cat > /tmp/worker-name.cjs <<'NODE'
          const fs = require("fs");
          // wrangler.jsonc is JSONC: whole-line // comments, block comments and
          // trailing commas are all legal and all reject JSON.parse. Only strip
          // WHOLE-LINE // comments, so `https://…` inside values survives.
          const json = fs.readFileSync("wrangler.jsonc", "utf8")
            .replace(/^\s*\/\/.*$/gm, "")
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .replace(/,(\s*[}\]])/g, "$1");
          process.stdout.write(String(JSON.parse(json).name || ""));
          NODE
          name=$(node /tmp/worker-name.cjs)
          echo "wrangler.jsonc name = ${name:-<empty>}"
          if [ "$name" != "agentic-inbox" ]; then
            echo "::error::Refusing to deploy: wrangler.jsonc in this ref targets worker '${name:-<empty>}', expected 'agentic-inbox'. Deploying would have written to a different worker."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Verify by querying the running system, not by trusting the deploy receipt.
      # /health reports the SHA compiled into the bundle, so this catches both a
      # stale artifact and a rollout that never reached 100%. Polled, because
      # Cloudflare propagation is not instantaneous.
      - name: Verify running version == deployed SHA
        env:
          EXPECTED: ${{ steps.sha.outputs.short }}
        run: |
          for i in $(seq 1 30); do
            running=$(curl -fsS https://mail.build/health | jq -r '.version // empty' || true)
            echo "attempt $i: running=${running:-<none>} expected=$EXPECTED"
            if [ "$running" = "$EXPECTED" ]; then
              echo "✅ running version matches deployed SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deploy did not converge: /health never reported $EXPECTED"
          exit 1
